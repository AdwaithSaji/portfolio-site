<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Abstract cover: concentric rings on a near plane with a lime pulse at the centre, beneath a faint, distant plane of rings in haze">
